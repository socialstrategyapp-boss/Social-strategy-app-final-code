name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'copilot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject production D1 database ID
        run: |
          set -euo pipefail
          db_id=$(npx wrangler d1 list --json | node -e "const fs=require('fs');const input=fs.readFileSync(0,'utf8');const dbs=JSON.parse(input);const found=dbs.find((db)=>db.name==='socialstrategy-db');if(!found?.uuid){console.error('Error: Database socialstrategy-db not found or missing uuid');process.exit(1)}process.stdout.write(found.uuid)")
          grep -q 'local-dev-placeholder' wrangler.jsonc || { echo 'Error: local-dev-placeholder not found in wrangler.jsonc'; exit 1; }
          sed -i "s/local-dev-placeholder/${db_id}/g" wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          output=$(npx wrangler pages project create webapp --production-branch=main 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -qi "already exists" || exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
