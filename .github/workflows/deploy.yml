name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'copilot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          output=$(npx wrangler pages project create webapp --production-branch=main 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -qi "already exists" || exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inject production D1 database ID
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || {
            echo "Missing required secret: CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          }
          placeholder_count=$(grep -c '"database_id": "local-dev-placeholder"' wrangler.jsonc || true)
          if [ "$placeholder_count" -eq 0 ]; then
            echo "No local-dev-placeholder database_id found in wrangler.jsonc"
            exit 1
          fi
          sed -i "s/\"database_id\": \"local-dev-placeholder\"/\"database_id\": \"$CLOUDFLARE_D1_DATABASE_ID\"/" wrangler.jsonc
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=webapp
