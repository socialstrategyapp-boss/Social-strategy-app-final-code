name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'copilot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          output=$(npx wrangler pages project create webapp --production-branch=main 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -qi "already exists" || exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inject production D1 database ID
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || {
            echo "Missing required secret: CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          }
          node <<'EOF'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          let cfg;
          try {
            cfg = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch (error) {
            console.error("wrangler.jsonc must be valid JSON in CI (comments/trailing commas are not supported by this step)");
            console.error(error.message);
            process.exit(1);
          }
          if (!Array.isArray(cfg.d1_databases)) {
            console.error("Missing d1_databases array in wrangler.jsonc");
            process.exit(1);
          }
          if (cfg.d1_databases.length === 0) {
            console.error("d1_databases array is empty in wrangler.jsonc");
            process.exit(1);
          }
          const dbIndex = cfg.d1_databases.findIndex((db) => db.binding === "DB");
          if (dbIndex === -1) {
            console.error("No D1 database entry with binding 'DB' found in wrangler.jsonc");
            process.exit(1);
          }
          cfg.d1_databases[dbIndex] = {
            ...cfg.d1_databases[dbIndex],
            database_id: process.env.CLOUDFLARE_D1_DATABASE_ID
          };
          fs.writeFileSync(path, `${JSON.stringify(cfg, null, 2)}\n`);
          EOF
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=webapp
